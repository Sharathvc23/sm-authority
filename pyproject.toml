[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-authority"
version = "0.0.1"
description = "Common Authority Evidence envelope — establishes sm-dat O1 (a grant's grantor/subject bound to the real owner) across OIDC, platform-install, domain, DID, civic, and recovery-key sources."
requires-python = ">=3.10"
dependencies = ["sm-arp"]

[tool.setuptools.packages.find]
include = ["sm_authority*"]
